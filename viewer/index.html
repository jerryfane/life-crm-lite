<div class="lc" id="vtop">
  <div class="lc-panel vw" id="vpaste">
    <h1>See your life CRM</h1>
    <p>Paste the data block your AI gave you (it starts with <b>{</b> and ends with <b>}</b>), then press <b>Show my page</b>. You can also upload a .json file.</p>
    <p class="vw-note">It stays on this laptop: your data is saved in this browser only and never sent anywhere.</p>
    <label for="vin" style="position:absolute;left:-9999px">Your data block</label>
    <textarea id="vin" spellcheck="false" placeholder='{ "lite": 1, "title": "My plan", "areas": [ … ], "steps": [ … ] }'></textarea>
    <div class="tools">
      <button class="btn dark" id="vshow" type="button">Show my page</button>
      <label class="btn" for="vfile">Upload a .json file</label>
      <input id="vfile" type="file" accept=".json,.txt,application/json,text/plain" hidden>
      <button class="btn" id="vcancel" type="button" hidden>Cancel</button>
    </div>
    <div class="lc-err" id="verr" role="alert" hidden></div>
  </div>
  <div class="lc-panel vw-bar" id="vbar" hidden>
    <span id="vstate" role="status">Saved on this laptop only (in this browser).</span>
    <div class="tools">
      <button class="btn dark" id="vexp" type="button">Download my sheet (.xlsx)</button>
      <button class="btn" id="vdown" type="button">Download my page</button>
      <button class="btn" id="vnew" type="button">Paste new data</button>
      <button class="btn quiet" id="vclear" type="button">Clear</button>
    </div>
    <p class="vw-ok" id="vmsg" hidden></p>
  </div>

    show(r.data, true);
    window.scrollTo(0, 0);
  }
  function say(t) { $("vmsg").textContent = t; $("vmsg").hidden = false; }
  function slug() { return (String(data.title || data.owner || "my-life-crm").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "my-life-crm"); }
  function save(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  $("vshow").onclick = function () { load($("vin").value); };
  $("vfile").onchange = function () {
    var f = this.files[0]; if (!f) return;
    f.text().then(function (t) { $("vin").value = t; load(t); });
    this.value = "";
  };
  $("vnew").onclick = function () { mode(false); $("vin").value = JSON.stringify(data, null, 2); $("vin").focus(); };
  $("vcancel").onclick = function () { mode(true); };
  $("vclear").onclick = function () {
    if (!confirm("Remove your data from this browser? Download your page first if you want to keep it.")) return;
    store.set(null);
    // only say it's gone once the saved copy really is
    if (store.get() !== null) return say("Couldn't clear the saved copy on this laptop. Clear your browser's site data to remove it.");
    data = null; LiteCRM.fail(out, ""); out.innerHTML = ""; $("vin").value = ""; mode(false);
  };
  $("vdown").onclick = function () {
    var json = JSON.stringify(data, null, 2).replace(/</g, "\\u003c");
    var html = TEMPLATE.replace(/(<script type="application\/json" id="lite-data">)[\s\S]*?(<\/script>)/, function (m, a, b) { return a + "\n" + json + "\n" + b; });
    save(new Blob([html], { type: "text/html" }), slug() + ".html");
    say("Downloaded " + slug() + ".html. Open it any time, even offline.");
  };
  $("vexp").onclick = function () {
    var p = LiteExport.problems(data);
    if (p.length) return say("I can't make your sheet yet: some names would land in the same sheet column, and one would overwrite the other. Ask your AI to rename them, then paste the new data block. " + p.join(". ") + ".");
    save(LiteExport.xlsx(data), slug() + ".xlsx");
    say("Downloaded " + slug() + ".xlsx, your life-crm sheet. To keep it in Google Drive: open drive.google.com, click New, then File upload, and choose this file. Then open it with Google Sheets (File > Save as Google Sheets).");
  };
  var saved = store.get(), r = saved && LiteCRM.parse(saved);
  if (r && r.data) show(r.data, false); else mode(false);
})();
</script>
</body>
</html>
