<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>life-crm lite viewer</title>

<!-- Built by page/build.py from viewer/src/ and page/src/. Edit those, then run: python3 page/build.py -->
<style>
/* life-crm lite page. Colours and shapes follow the life-crm dashboard. */
:root { color-scheme: light only; --ink: #111827; --muted: #6b7280; --faint: #9ca3af; --line: #e5e7eb; --line2: #f1f2f4; --bg: #f4f3ef; --today: #ef4444; --amber: #b45309;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
a { color: #1f5f5b; }
.c-teal { --c: #1f5f5b; } .c-indigo { --c: #4f46e5; } .c-amber { --c: #b45309; } .c-blue { --c: #0369a1; } .c-pink { --c: #be185d; }
.c-green { --c: #15803d; } .c-violet { --c: #6d28d9; } .c-red { --c: #b91c1c; } .c-orange { --c: #c2410c; } .c-gray { --c: #6b7280; }
[class*="c-"] { --t: color-mix(in srgb, var(--c) 11%, white); }
.lc { max-width: 1360px; margin: 0 auto; padding: 24px; }
.lc-panel { background: #fff; border: 1px solid #e3e1db; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 26px 30px 30px; margin-bottom: 18px; }
.lc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 18px; }
.lc-top h1 { margin: 0; font-size: 26px; font-weight: 750; letter-spacing: -.025em; line-height: 1.2; }
.lc-tone { margin: 8px 0 0; font-size: 16px; color: #374151; border-left: 3px solid #1f5f5b; padding: 2px 0 2px 12px; max-width: 760px; }
.lc-meta { font-size: 13px; color: var(--muted); text-align: right; }
.lc-meta a { font-weight: 650; text-decoration: none; }
h2.lc-h { margin: 0 0 4px; font-size: 18px; font-weight: 750; letter-spacing: -.015em; }
.lc-sub { margin: 0 0 16px; font-size: 13.5px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
/* status: always a word, colour only helps */
.st { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; vertical-align: 1px; }
.st-todo { background: #f3f4f6; color: #374151; } .st-doing { background: #e0f2fe; color: #075985; } .st-waiting { background: #fef3c7; color: #92400e; }
.st-stuck { background: #fee2e2; color: #991b1b; } .st-done { background: #dcfce7; color: #166534; }
/* countdown cards */
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
.key { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; min-width: 0; background: #fff; }
.key-n { flex: none; min-width: 58px; height: 52px; border-radius: 10px; background: var(--t); color: var(--c); display: grid; place-items: center; text-align: center; line-height: 1; padding: 0 6px; }
.key-n b { font-size: 20px; letter-spacing: -.02em; display: block; }
.key-n small { font-size: 10px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
.key-t { min-width: 0; }
.key-t strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.key-t > span { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* timeline */
.rm-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; -webkit-overflow-scrolling: touch; }
.rm { position: relative; min-width: calc(190px + var(--n, 12) * 76px); }
.rm-row { display: flex; }
.rm-lab { width: 190px; flex: none; position: sticky; left: 0; z-index: 6; background: #fff; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 13px; font-weight: 650; border-right: 1px solid #eef0f2; min-width: 0; }
.rm-lab > span { min-width: 0; }
.rm-lab small { display: block; font-weight: 500; color: var(--faint); font-size: 11.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rm-trk { flex: 1; position: relative; min-width: 0; }
.rm-head .rm-lab, .rm-head .rm-trk { background: #fafafa; border-bottom: 1px solid var(--line); height: 48px; }
.rm-head .rm-lab { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.rm-lane .rm-lab, .rm-lane .rm-trk { border-bottom: 1px solid var(--line2); }
.rm-lane:last-child .rm-lab, .rm-lane:last-child .rm-trk { border-bottom: 0; }
.rm-m { position: absolute; top: 0; height: 100%; padding: 8px 4px 0 9px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; border-left: 1px solid #e3e5e8; }
.rm-m.y { color: var(--ink); }
.rm-g { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line2); }
.rm-now { position: absolute; top: 27px; bottom: 0; width: 2px; margin-left: -1px; background: var(--today); z-index: 4; pointer-events: none; }
.rm-nowtag { position: absolute; top: 27px; margin-left: -1px; background: var(--today); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 1px 6px; border-radius: 0 4px 4px 0; z-index: 5; text-transform: uppercase; }
.it { position: absolute; z-index: 2; height: 26px; }
.ms { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--c); white-space: nowrap; }
.ms.left { flex-direction: row-reverse; }
.ms i { width: 11px; height: 11px; flex: none; background: var(--c); transform: rotate(45deg); border-radius: 2px; box-shadow: 0 0 0 3px #fff; }
.ms.done i { width: 13px; height: 13px; transform: none; border-radius: 50%; }
.ms.done, .bar.done { opacity: .55; }
.ms.late, .lbl.late { color: var(--amber); } .ms.late i { background: var(--amber); }
.ms.waiting i, .ms.stuck i { background: #fff; box-shadow: 0 0 0 2px var(--c) inset, 0 0 0 3px #fff; }
.ms em, .bar em, .lbl em { font-style: normal; font-weight: 600; opacity: .8; }
.ms > span, .lbl { background: rgba(255,255,255,.85); border-radius: 4px; padding: 0 2px; }
.bar { height: 26px; border-radius: 7px; padding: 0 10px; font-size: 12px; font-weight: 650; display: flex; align-items: center; white-space: nowrap; overflow: hidden; background: var(--t); color: var(--c); text-overflow: ellipsis; }
.bar.cut-l { border-top-left-radius: 0; border-bottom-left-radius: 0; } .bar.cut-r { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.lbl { height: 26px; display: flex; align-items: center; font-size: 12px; font-weight: 650; color: var(--c); white-space: nowrap; }
.tick { position: absolute; z-index: 1; top: 9px; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: var(--c); opacity: .35; }
.rm-more { position: absolute; right: 8px; font-size: 11.5px; font-weight: 650; color: var(--muted); white-space: nowrap; background: #fff; padding: 0 4px; z-index: 3; }
.rm-empty { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--faint); }
.nodate { margin: 12px 0 0; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.rm-hint { display: none; margin: 6px 0 0; font-size: 12px; color: var(--faint); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #374151; padding: 3px 10px 3px 9px; border-radius: 999px; border: 1.5px dashed color-mix(in srgb, var(--c) 45%, white); background: #fff; }
/* matrix */
.mx { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.q { border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; background: #fff; border-top: 4px solid var(--qc); }
.q h3 { margin: 0; font-size: 15px; font-weight: 750; display: flex; justify-content: space-between; gap: 8px; }
.q h3 span { color: var(--faint); font-weight: 650; font-size: 13px; }
.q > p { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); }
.q-do { --qc: #b91c1c; } .q-sch { --qc: #1f5f5b; } .q-del { --qc: #b45309; } .q-drop { --qc: #9ca3af; } .q-un { --qc: #d1d5db; grid-column: 1 / -1; }
.card { border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 10px; padding: 9px 12px; margin-top: 8px; font-size: 13px; }
.card b { display: block; font-size: 14px; font-weight: 650; line-height: 1.35; }
.card div { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 4px; color: var(--muted); font-size: 12.5px; }
.card .late { color: var(--amber); font-weight: 700; }
.card .who { color: #92400e; font-weight: 650; }
.none { color: var(--faint); font-size: 13px; margin: 6px 0 0; }
/* tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; -webkit-overflow-scrolling: touch; }
.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 750; background: #fafafa; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 8px 12px; border-bottom: 1px solid var(--line2); vertical-align: top; }
.t tr:last-child td { border-bottom: 0; }
h3.lc-lh { margin: 0 0 8px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.lc-err { max-width: 720px; margin: 40px auto; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 14px; padding: 16px 20px; font-size: 15px; }
.lc-warn { font-size: 13px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 8px 14px; margin-bottom: 18px; }
.lc-foot { text-align: center; font-size: 12px; color: var(--faint); margin: 8px 0 24px; }
@media (max-width: 760px) {
  .lc { padding: 12px; }
  .lc-panel { padding: 18px 16px 20px; border-radius: 14px; }
  .lc-top h1 { font-size: 22px; }
  .lc-meta { text-align: left; }
  .keys, .mx { grid-template-columns: 1fr; }
  .rm { min-width: calc(128px + var(--n, 12) * 74px); }
  .rm-lab { width: 128px; padding: 0 10px; }
  .rm-hint { display: block; }
}
@media print { body { background: #fff; } .lc-panel { box-shadow: none; break-inside: avoid; } }
.vw h1 { margin: 0 0 6px; font-size: 24px; font-weight: 750; letter-spacing: -.025em; }
.vw p { margin: 0 0 12px; color: #374151; }
.vw-note { font-size: 13.5px; color: #166534 !important; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 8px 12px; }
.vw textarea { width: 100%; min-height: 180px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); background: #fafafa; resize: vertical; }
.vw textarea:focus { outline: 2px solid #1f5f5b; outline-offset: 1px; background: #fff; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 9px; font: 650 14px var(--sans); border: 1px solid var(--line); background: #fff; color: var(--ink); white-space: nowrap; cursor: pointer; }
.btn:hover { border-color: #c7cbd1; }
.btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); } .btn.dark:hover { background: #1f2937; }
.btn.quiet { color: #991b1b; }
.vw-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 14px 20px; }
.vw-bar .tools { margin: 0; }
.vw-bar span { font-size: 13.5px; color: #166534; }
.vw .lc-err { margin: 12px 0 0; max-width: none; }
.vw-ok { margin: 12px 0 0 !important; font-size: 13.5px; color: #374151; }
#vtop { padding-bottom: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="lc" id="vtop">
  <div class="lc-panel vw" id="vpaste">
    <h1>See your life CRM</h1>
    <p>Paste the data block your AI gave you (it starts with <b>{</b> and ends with <b>}</b>), then press <b>Show my page</b>. You can also upload a .json file.</p>
    <p class="vw-note">It stays on this laptop: your data is saved in this browser only and never sent anywhere.</p>
    <label for="vin" style="position:absolute;left:-9999px">Your data block</label>
    <textarea id="vin" spellcheck="false" placeholder='{ "lite": 1, "title": "My plan", "areas": [ … ], "steps": [ … ] }'></textarea>
    <div class="tools">
      <button class="btn dark" id="vshow" type="button">Show my page</button>
      <label class="btn" for="vfile">Upload a .json file</label>
      <input id="vfile" type="file" accept=".json,.txt,application/json,text/plain" hidden>
      <button class="btn" id="vcancel" type="button" hidden>Cancel</button>
    </div>
    <div class="lc-err" id="verr" role="alert" hidden></div>
  </div>
  <div class="lc-panel vw-bar" id="vbar" hidden>
    <span>Saved on this laptop only (in this browser).</span>
    <div class="tools">
      <button class="btn dark" id="vdown" type="button">Download my page</button>
      <button class="btn" id="vexp" type="button">Export for life-crm</button>
      <button class="btn" id="vnew" type="button">Paste new data</button>
      <button class="btn quiet" id="vclear" type="button">Clear</button>
    </div>
    <p class="vw-ok" id="vmsg" hidden></p>
  </div>
</div>
<div id="lite"></div>
<script>
/* life-crm lite renderer, shared by page/template.html and viewer/index.html (page/build.py inlines it).
   LiteCRM.parse(text) -> {data} or {error}; LiteCRM.mount(element, data) draws the page. */
var LiteCRM = (function () {
  "use strict";
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var COLORS = ["teal", "indigo", "amber", "blue", "pink", "green", "violet", "red", "orange", "gray"];
  var STATUS = { todo: "To do", doing: "Doing", waiting: "Waiting", stuck: "Stuck", done: "Done" };
  var QUADS = [
    ["do", "Do now", "Important and urgent."],
    ["sch", "Schedule", "Important, not urgent: give it a date."],
    ["del", "Delegate", "Urgent, not important: hand it to a person or an AI."],
    ["drop", "Drop", "Neither: let it go, or park it."]
  ];
  var DAY = 864e5, LANE = 32, cur = null, lastW = 0, ctx;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function txt(v) { return v == null ? "" : String(v).trim(); }
  function day(s) {
    var m = /^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?$/.exec(txt(s));
    if (!m) return null;
    var d = new Date(+m[1], m[2] - 1, m[3] ? +m[3] : 1);
    return d.getMonth() === m[2] - 1 ? d : null;
  }
  function diff(a, b) { return Math.round((b - a) / DAY); }
  function addM(d, n) { var x = new Date(d.getFullYear(), d.getMonth() + n, 1); x.setDate(Math.min(d.getDate(), new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; }
  function fmt(d, approx, today) {
    if (approx) return MON[d.getMonth()] + " " + d.getFullYear();
    return MON[d.getMonth()] + " " + d.getDate() + (d.getFullYear() !== today.getFullYear() ? ", " + d.getFullYear() : "");
  }
  function due(s, today) {
    if (s.approx) return fmt(s.d, true, today);
    var n = diff(today, s.d);
    if (n < 0) return n === -1 ? "1 day late" : -n + " days late";
    if (n === 0) return "Today";
    if (n === 1) return "Tomorrow";
    if (n < 7) return WD[s.d.getDay()] + " " + s.d.getDate();
    return fmt(s.d, false, today);
  }
  function countdown(d, today) {
    var n = diff(today, d);
    if (n === 0) return ["Today", ""];
    if (n < 14) return [n, n === 1 ? "day" : "days"];
    if (n < 70) return [Math.round(n / 7), "weeks"];
    return [Math.max(2, Math.round(n / 30.44)), "months"];
  }
  // supported repeat forms: daily, weekly, monthly, every N days/weeks/months
  function rule(r) {
    r = txt(r).toLowerCase();
    var m = { daily: [1, "d"], weekly: [1, "w"], monthly: [1, "m"] }[r];
    if (m) return m;
    m = /^every (\d+ )?(day|week|month)s?$/.exec(r);
    return m ? [m[1] ? +m[1] : 1, m[2][0]] : null;
  }
  function occur(base, r, i) {
    if (r[1] === "m") return addM(base, r[0] * i);
    return new Date(base.getFullYear(), base.getMonth(), base.getDate() + i * r[0] * (r[1] === "w" ? 7 : 1));
  }
  function width(s) {
    if (!ctx) { ctx = document.createElement("canvas").getContext("2d"); }
    ctx.font = "650 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif";
    return Math.ceil(ctx.measureText(s).width) + 4;
  }

  function parse(text) {
    text = txt(text);
    if (!text) return { error: "There's nothing here yet. Paste the data block your AI gave you." };
    var m = /<script[^>]*lite-data[^>]*>([\s\S]*?)<\/script>/i.exec(text);
    if (m) text = m[1];
    var i = text.indexOf("{"), j = text.lastIndexOf("}");
    if (i < 0 || j < i) return { error: "I can't find a data block here. It starts with { and ends with }. Copy the whole block from your AI and paste it again." };
    var data;
    try { data = JSON.parse(text.slice(i, j + 1)); } catch (e) {
      return { error: "This data block is broken, so I can't read it. Often the end got cut off when copying: copy the whole block again, from the first { to the last }. (Details: " + e.message + ")" };
    }
    if (!data || typeof data !== "object" || Array.isArray(data)) return { error: "This isn't a life-crm lite data block: it should be one { … } block." };
    if (!Array.isArray(data.areas) || !Array.isArray(data.steps)) return { error: "This doesn't look like a life-crm lite data block: it needs a list of \"areas\" and a list of \"steps\". Ask your AI for \"my life-crm lite data block\" and paste that." };
    return { data: data };
  }

  function prep(data, today) {
    var warn = [], byId = {}, areas = [];
    data.areas.forEach(function (a, i) {
      if (!a || typeof a !== "object") return;
      var id = txt(a.id || a.name) || "area" + i;
      var x = { id: id, name: txt(a.name) || id, goal: txt(a.goal), color: COLORS.indexOf(txt(a.color).toLowerCase()) >= 0 ? txt(a.color).toLowerCase() : COLORS[i % 9], steps: [] };
      if (!byId[id]) { byId[id] = x; areas.push(x); }
    });
    function area(id) {
      id = txt(id);
      if (!byId[id]) { byId[id] = { id: id, name: id || "Other", goal: "", color: "gray", steps: [] }; areas.push(byId[id]); }
      return byId[id];
    }
    var steps = data.steps.filter(function (s) { return s && typeof s === "object"; }).map(function (s) {
      var title = txt(s.title) || "(no title)", st = txt(s.status).toLowerCase(), owner = txt(s.owner);
      if (!STATUS[st]) { if (st) warn.push("“" + title + "”: status “" + s.status + "” isn't one of todo, doing, waiting, stuck, done; shown as To do."); st = "todo"; }
      var x = { title: title, status: st, open: st !== "done", area: area(s.area), who: owner && owner.toLowerCase() !== "me" ? owner : "",
        rep: txt(s.repeat), notes: txt(s.notes), link: txt(s.link), imp: txt(s.importance).toLowerCase(), urg: txt(s.urgency).toLowerCase() };
      ["date", "start", "end"].forEach(function (k) {
        if (txt(s[k]) && !day(s[k])) warn.push("“" + title + "”: I can't read the " + k + " “" + s[k] + "” (use YYYY-MM-DD); shown without it.");
      });
      var d = day(s.date), a = day(s.start), b = day(s.end);
      if (d) { x.d = d; x.approx = /^\d{4}-\d{1,2}$/.test(txt(s.date)); }
      else if (a && b && b >= a) { x.a = a; x.b = b; }
      else if (a || b) { x.d = a || b; if (a && b) warn.push("“" + title + "”: the end is before the start; shown at its start."); }
      x.rule = x.rep && x.d ? rule(x.rep) : null;
      if (x.rule && x.open) { // move a past due date forward to the next occurrence
        for (var i = 0, n = x.d; n < today && i < 5000; i++) n = occur(x.d, x.rule, i + 1);
        if (i) x.d = n;
      }
      x.when = x.d || x.a || null;
      x.area.steps.push(x);
      return x;
    });
    return { areas: areas, steps: steps, warn: warn };
  }

  function stTag(s) { return '<span class="st st-' + s.status + '">' + STATUS[s.status] + "</span>"; }
  function tip(s, today) {
